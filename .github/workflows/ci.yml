name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v7.0.1

      # uv ANTES de setup-python: o cache "uv" de setup-python exige uv no PATH
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"

      # uv sync inclui o grupo dev por padrao
      - name: Install dependencies
        run: uv sync

      - name: Install system deps for Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0

      - name: Run ruff
        run: uv run ruff check .

      - name: Run mypy
        run: uv run mypy

      - name: Run import-linter
        run: uv run import-linter lint

      - name: Run pytest
        run: uv run pytest
        env:
          QT_QPA_PLATFORM: offscreen
