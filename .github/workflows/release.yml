name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group build

      - name: Build with PyInstaller (onedir)
        run: uv run pyinstaller packaging/pyinstaller.spec --distpath dist/${{ matrix.os }}

      - name: Package Linux (AppImage + .deb)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          # --- AppImage ---
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          # Extrair evita depender de FUSE, ausente em runners
          ./appimagetool --appimage-extract > /dev/null

          mkdir -p AppDir/usr/bin
          cp -r dist/ubuntu-22.04/ERP/* AppDir/usr/bin/
          cp packaging/linux/erp.desktop AppDir/erp.desktop
          cp packaging/linux/icons/erp.png AppDir/erp.png
          printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/usr/bin/ERP" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun

          ./squashfs-root/AppRun AppDir "nexoerp-${VERSION}-x86_64.AppImage"

          # --- .deb (nfpm versao fixada; URL oficial goreleaser/nfpm) ---
          NFPM_VERSION=2.48.0
          wget -q "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -O nfpm.tar.gz
          tar xzf nfpm.tar.gz nfpm
          sed "s/__VERSION__/${VERSION}/" packaging/linux/nfpm.yaml > nfpm.rendered.yaml
          ./nfpm package --config nfpm.rendered.yaml --packager deb --target "dist/nexoerp-${VERSION}-amd64.deb"

      - name: Package Windows (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.os }}
          path: |
            dist/**
            nexoerp-*.AppImage
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
