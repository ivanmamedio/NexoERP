name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 \
            libgl1 \
            libgles2 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-shm0 \
            libxcb-xfixes0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0 \
            libfontconfig1 \
            libfreetype6 \
            fuse3

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group build

      - name: Debug migration file content
        shell: bash
        run: |
          echo "=== Checking migration file in repo ==="
          cat src/erp/shared/infrastructure/database/alembic/versions/0012_user_number_and_employee_name.py | head -100
          echo "=== End of migration preview ==="

      - name: Build with PyInstaller (onedir)
        shell: bash
        run: |
          set -eu
          echo "=== Cleaning build cache ==="
          rm -rf build/ dist/ *.spec
          echo "=== Starting PyInstaller build ==="
          echo "Working dir: $(pwd)"
          echo "Dist path: dist/${{ matrix.os }}"
          uv run pyinstaller packaging/pyinstaller.spec --distpath dist/${{ matrix.os }} --clean 2>&1
          PYI_EXIT=$?
          echo "=== PyInstaller exit code: $PYI_EXIT ==="
          echo "=== Current dir contents ==="
          ls -la
          echo "=== dist/ contents (if exists) ==="
          ls -la dist/ 2>/dev/null || echo "dist/ not found"
          echo "=== dist/${{ matrix.os }} contents (if exists) ==="
          ls -la dist/${{ matrix.os }}/ 2>/dev/null || echo "dist/${{ matrix.os }} not found"
          echo "=== Full find from project root ==="
          find . -name "ERP*" -type d 2>/dev/null | head -20
          echo "=== find dist/ tree ==="
          find dist/ -type f -o -type d 2>/dev/null | head -80 || true
          exit $PYI_EXIT

      - name: Package Linux (AppImage + .deb)
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          DIST_PATH="dist/${{ matrix.os }}"

          echo "=== Debug: checking dist structure ==="
          ls -la "${DIST_PATH}/"
          ls -la "${DIST_PATH}/ERP/"
          echo "=== Contents of ERP dir ==="
          find "${DIST_PATH}/ERP" -maxdepth 1 -mindepth 1

          # --- AppImage ---
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x appimagetool
          # Extrair evita depender de FUSE, ausente em runners
          ./appimagetool --appimage-extract > /dev/null

          mkdir -p AppDir/usr/bin
          # Copy the entire ERP directory contents (binary + _internal)
          cp -r "${DIST_PATH}/ERP/." AppDir/usr/bin/
          cp packaging/linux/erp.desktop AppDir/erp.desktop
          cp packaging/linux/icons/erp.png AppDir/erp.png
          printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/usr/bin/ERP" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun

          ./squashfs-root/AppRun AppDir "nexoerp-${VERSION}-x86_64.AppImage"

          # --- .deb (nfpm versao fixada; URL oficial goreleaser/nfpm) ---
          NFPM_VERSION=2.48.0
          wget -q "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz" -O nfpm.tar.gz
          tar xzf nfpm.tar.gz nfpm
          sed -e "s/__VERSION__/${VERSION}/" -e "s|__DIST_PATH__|${DIST_PATH}|" packaging/linux/nfpm.yaml > nfpm.rendered.yaml
          ./nfpm package --config nfpm.rendered.yaml --packager deb --target "dist/nexoerp-${VERSION}-amd64.deb"

      - name: Package Windows (Inno Setup)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss

      # Soma apenas os pacotes finais. A arvore onedir bruta (ERP/_internal)
      # NAO deve ser artefato nem asset de release: excederia o limite de
      # assets do GitHub e poluiria a pagina do Release.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ matrix.os }}
          path: |
            dist/nexoerp-*.deb
            nexoerp-*.AppImage
            dist/windows/NexoERP-Setup.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
