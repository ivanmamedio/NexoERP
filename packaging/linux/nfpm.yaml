deb:
  name: nexoerp
  description: "ERP offline-first para pequenos comércios"
  maintainer: "NexoERP <contato@nexoerp.com>"
  vendor: "NexoERP"
  homepage: "https://github.com/ivanmamedio/NexoERP"
  license: "AGPL-3.0-only"
  section: "office"
  priority: "optional"
  architectures:
    - amd64
  contents:
    - src: dist/ubuntu-22.04/ERP/ERP
      dst: /usr/bin/erp
    - src: packaging/linux/erp.desktop
      dst: /usr/share/applications/erp.desktop
  depends:
    - libxcb-icccm4
    - libxcb-image0
    - libxcb-keysyms1
    - libxcb-randr0
    - libxcb-render-util0
    - libxcb-shape0
    - libxcb-shm0
    - libxcb-xfixes0
    - libxcb-xinerama0
    - libxcb-xkb1
    - libxkbcommon-x11-0
    - libfontconfig1
    - libfreetype6
    - libgl1
    - libgles2
