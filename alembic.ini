[alembic]
# path to migration scripts
script_location = erp.shared.infrastructure.database:alembic

# version location
version_locations = erp.shared.infrastructure.database:alembic/versions

# sqlalchemy.url will be overridden programmatically at runtime
sqlalchemy.url = sqlite:///:memory:

# logging
[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
